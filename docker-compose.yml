# Local infrastructure for Tierstack.
# The application itself runs on the host via `npm run dev`; this file provides
# only the stateful services it needs.

services:
  postgres:
    image: postgres:16-alpine
    container_name: tierstack_postgres
    environment:
      POSTGRES_USER: tierstack
      POSTGRES_PASSWORD: tierstack
      POSTGRES_DB: tierstack
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tierstack -d tierstack"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tierstack_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
