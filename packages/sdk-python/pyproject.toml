[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tierstack"
version = "0.1.0"
description = "Official Python SDK for the Tierstack API."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://gettierstack.com"
Documentation = "https://gettierstack.com/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tierstack = ["py.typed"]

[tool.ruff]
target-version = "py39"
